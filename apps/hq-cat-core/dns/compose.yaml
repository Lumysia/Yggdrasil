services:
  adguardhome:
    image: adguard/adguardhome:latest
    restart: always
    ports:
      - 3000:3000/tcp
      - 53:53/udp
      - 53:53/tcp
    volumes:
      - ${LOGS_PATH}/adguardhome:/opt/adguardhome/work
      - ${APPDATA_PATH}/adguardhome:/opt/adguardhome/conf
    env_file:
      - stack.env
