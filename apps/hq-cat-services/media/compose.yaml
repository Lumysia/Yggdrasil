services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    restart: unless-stopped
    networks:
      - shared_media_net
    labels:
      caddy: media.${COMMON_DOMAIN_A}
      caddy.import_0: common_tls
      caddy.@decypharr.path: /decypharr /decypharr/*
      caddy.@prowlarr.path: /prowlarr /prowlarr/*
      caddy.@radarr.path: /radarr /radarr/*
      caddy.@sonarr.path: /sonarr /sonarr/*
      caddy.0_handle: /oauth2/*
      caddy.0_handle.reverse_proxy: oauth2-proxy:4180
      caddy.1_redir: /decypharr /decypharr/ 308
      caddy.2_handle: "@decypharr"
      caddy.2_handle.0_import: protected_forward_auth
      caddy.2_handle.1_reverse_proxy: decypharr:8282
      caddy.3_redir: /prowlarr /prowlarr/ 308
      caddy.4_handle: "@prowlarr"
      caddy.4_handle.0_import: protected_forward_auth
      caddy.4_handle.1_reverse_proxy: prowlarr:9696
      caddy.5_redir: /radarr /radarr/ 308
      caddy.6_handle: "@radarr"
      caddy.6_handle.0_import: protected_forward_auth
      caddy.6_handle.1_reverse_proxy: radarr:7878
      caddy.7_redir: /sonarr /sonarr/ 308
      caddy.8_handle: "@sonarr"
      caddy.8_handle.0_import: protected_forward_auth
      caddy.8_handle.1_reverse_proxy: sonarr:8989
      caddy.9_handle: /*
      caddy.9_handle.reverse_proxy: "{{upstreams 8096}}"
    volumes:
      - ${APPDATA_PATH}/jellyfin:/config
      - ${MEDIA_PATH}/others:/data/others
      - ${MEDIA_PATH}/torbox:/data/torbox:ro
    tmpfs:
      - /cache
    env_file:
      - stack.env

  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    restart: unless-stopped
    networks:
      - shared_media_net
    labels:
      caddy: seerr.${COMMON_DOMAIN_A}
      caddy.import: common_tls
      caddy.reverse_proxy: "{{upstreams 5055}}"
    volumes:
      - ${APPDATA_PATH}/seerr:/app/config
    env_file:
      - stack.env
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3

  decypharr:
    image: cy01/blackhole:latest
    restart: unless-stopped
    networks:
      - shared_media_net
    volumes:
      - ${APPDATA_PATH}/decypharr:/app
      - ${MEDIA_PATH}:/mnt:rshared
    devices:
      - /dev/fuse:/dev/fuse:rwm
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    env_file:
      - stack.env

  torbox-media-center:
    image: anonymoussystems/torbox-media-center:latest
    restart: unless-stopped
    init: true
    stdin_open: true
    tty: true
    volumes:
      - ${MEDIA_PATH}/torbox:/torbox
    env_file:
      - stack.env
    environment:
      TORBOX_API_KEY: ${TORBOX_API_KEY}

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    restart: unless-stopped
    networks:
      - shared_media_net
    volumes:
      - ${APPDATA_PATH}/prowlarr:/config
    env_file:
      - stack.env
    environment:
      PROWLARR__SERVER__URLBASE: /prowlarr

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    restart: unless-stopped
    networks:
      - shared_media_net
    volumes:
      - ${APPDATA_PATH}/radarr:/config
      - ${MEDIA_PATH}/torbox:/torbox
    env_file:
      - stack.env
    environment:
      RADARR__SERVER__URLBASE: /radarr

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    restart: unless-stopped
    networks:
      - shared_media_net
    volumes:
      - ${APPDATA_PATH}/sonarr:/config
      - ${MEDIA_PATH}/torbox:/torbox
    env_file:
      - stack.env
    environment:
      SONARR__SERVER__URLBASE: /sonarr

  flaresolverr:
    image: flaresolverr/flaresolverr:latest
    restart: unless-stopped
    networks:
      - shared_media_net
    volumes:
      - ${APPDATA_PATH}/flaresolverr:/config
    env_file:
      - stack.env

networks:
  shared_media_net:
    external: true
