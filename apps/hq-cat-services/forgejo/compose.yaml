services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:17
    restart: unless-stopped
    labels:
      caddy: git.${COMMON_DOMAIN_A}
      caddy.import: common_tls
      caddy.reverse_proxy: "{{upstreams 3000}}"
    env_file:
      - stack.env
    environment:
      FORGEJO__SERVER__DOMAIN: git.${COMMON_DOMAIN_A}
      FORGEJO__SERVER__ROOT_URL: https://git.${COMMON_DOMAIN_A}
      FORGEJO__SERVICE__NO_REPLY_ADDRESS: ${COMMON_DOMAIN_A}
      FORGEJO__MAILER__FROM: Forgejo <no-reply@${COMMON_DOMAIN_A}>
      FORGEJO__MAILER__SMTP_ADDR: ${EMAIL_SMTP_HOST}
      FORGEJO__MAILER__USER: ${EMAIL_SMTP_USERNAME}
      FORGEJO__MAILER__PASSWD: ${EMAIL_SMTP_PASSWORD}
    networks:
      - shared_forgejo_net
    volumes:
      - ${BLOBSTORE_PATH}/forgejo:/data

networks:
  shared_forgejo_net:
    external: true
