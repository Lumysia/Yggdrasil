services:
  caddy:
    image: essaypu/caddy:alpine-proxy-nightly
    command:
      - caddy
      - docker-proxy
    restart: always
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    networks:
      - shared_aiapi_net
      - shared_seafile_net
      - shared_immich_net
      - shared_forgejo_net
      - shared_lobechat_net
      - shared_remnawave_net
      - oauth2_proxy_intranet
      - cloudflare_net
    volumes:
      - ${APPDATA_PATH}/caddyservices/data:/data/caddy
      - ${APPDATA_PATH}/caddyservices/config:/config/caddy
      - /var/run/docker.sock:/var/run/docker.sock:ro
    env_file:
      - stack.env
    environment:
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
    labels:
      caddy_0.email: ${COMMON_CADDY_ADMIN_EMAIL}
      caddy_1.admin: "off"
      caddy_2.servers.trusted_proxies: static private_ranges 103.21.244.0/22 103.22.200.0/22 103.31.4.0/22 104.16.0.0/13 104.24.0.0/14 108.162.192.0/18 131.0.72.0/22 141.101.64.0/18 162.158.0.0/15 172.64.0.0/13 173.245.48.0/20 188.114.96.0/20 190.93.240.0/20 197.234.240.0/22 198.41.128.0/17 2400:cb00::/32 2606:4700::/32 2803:f800::/32 2405:b500::/32 2405:8100::/32 2a06:98c0::/29 2c0f:f248::/32
      caddy_3: (common_tls)
      caddy_3.tls.dns: cloudflare ${CLOUDFLARE_API_TOKEN}
      caddy_3.tls.resolvers: 8.8.8.8 8.8.4.4 1.1.1.1
      caddy_4: (protected_reverse_proxy)
      caddy_4.handle_0: /oauth2/*
      caddy_4.handle_0.reverse_proxy: oauth2-proxy:4180
      caddy_4.handle_1: /*
      caddy_4.handle_1.forward_auth: http://oauth2-proxy:4180
      caddy_4.handle_1.forward_auth.1_uri: /oauth2/auth
      caddy_4.handle_1.forward_auth.2_@error: status 401
      caddy_4.handle_1.forward_auth.3_handle_response: "@error"
      caddy_4.handle_1.forward_auth.3_handle_response.1_redir: "* /oauth2/sign_in?rd={scheme}://{host}{uri} 302"
      caddy_4.handle_1.reverse_proxy: "{args[0]}"
      caddy_5: (protected_reverse_proxy_except)
      caddy_5.@protected_paths: |-
        not path {args[1:]}
      caddy_5.handle_0: /oauth2/*
      caddy_5.handle_0.reverse_proxy: oauth2-proxy:4180
      caddy_5.handle_1: /*
      caddy_5.handle_1.forward_auth: "@protected_paths http://oauth2-proxy:4180"
      caddy_5.handle_1.forward_auth.1_uri: /oauth2/auth
      caddy_5.handle_1.forward_auth.2_@error: status 401
      caddy_5.handle_1.forward_auth.3_handle_response: "@error"
      caddy_5.handle_1.forward_auth.3_handle_response.1_redir: "* /oauth2/sign_in?rd={scheme}://{host}{uri} 302"
      caddy_5.handle_1.reverse_proxy: "{args[0]}"
  
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: always
    networks:
      - cloudflare_net
      - shared_forgejo_net
    env_file:
      - stack.env
    command: tunnel --no-autoupdate --protocol auto run --token ${HQCAT_SERVICES_CFD_TOKEN}

  oauth2-proxy-redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: redis-server --save 60 1000 --appendonly yes
    volumes:
      - ${APPDATA_PATH}/oauth2-proxy-redis:/data
    networks:
      - oauth2_proxy_intranet
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:latest
    restart: unless-stopped
    networks:
      - oauth2_proxy_intranet
      - oauth2_proxy_net
    env_file:
      - stack.env
    environment:
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: true
      OAUTH2_PROXY_CLIENT_ID: 6b6d7d3f-3b3c-47be-a213-f3735bda6c73
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH2_PROXY_CLIENT_SECRET}
      OAUTH2_PROXY_CODE_CHALLENGE_METHOD: S256
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET}
      OAUTH2_PROXY_COOKIE_NAME: __Secure-hq-cat-services-oauth2-proxy
      OAUTH2_PROXY_COOKIE_SECURE: true
      OAUTH2_PROXY_COOKIE_SAMESITE: lax
      OAUTH2_PROXY_COOKIE_EXPIRE: 24h
      OAUTH2_PROXY_COOKIE_REFRESH: 1h
      OAUTH2_PROXY_COOKIE_CSRF_PER_REQUEST: true
      OAUTH2_PROXY_COOKIE_CSRF_EXPIRE: 5m
      OAUTH2_PROXY_SESSION_STORE_TYPE: redis
      OAUTH2_PROXY_REDIS_CONNECTION_URL: redis://oauth2-proxy-redis:6379
      OAUTH2_PROXY_PROVIDER: oidc
      OAUTH2_PROXY_OIDC_ISSUER_URL: https://id.${COMMON_DOMAIN_A}
      OAUTH2_PROXY_WHITELIST_DOMAINS: .${COMMON_DOMAIN_A}
      OAUTH2_PROXY_SCOPE: openid email profile
      OAUTH2_PROXY_REVERSE_PROXY: true
      OAUTH2_PROXY_TRUSTED_PROXY_IPS: 172.16.0.0/12
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
    depends_on:
      oauth2-proxy-redis:
        condition: service_healthy

networks:
  cloudflare_net:
    enable_ipv6: true
  shared_aiapi_net:
    external: true
  shared_seafile_net:
    external: true
  shared_immich_net:
    external: true
  shared_forgejo_net:
    external: true
  shared_lobechat_net:
    external: true
  shared_remnawave_net:
    external: true
  oauth2_proxy_intranet:
    internal: true
  oauth2_proxy_net:
