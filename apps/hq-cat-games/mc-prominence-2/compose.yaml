services:
  mc:
    image: itzg/minecraft-server:${MC_JAVA_VERSION}
    restart: unless-stopped
    tty: true
    stdin_open: true
    ports:
      - ${MC_PORT}:25565/tcp
    env_file:
      - stack.env
    environment:
      RCON_PASSWORD: ${RCON_PASSWORD}
    volumes:
      - ${GAMES_PATH}/${MC_FOLDER_NAME}:/data
      - ${GAMES_PATH}/${MC_FOLDER_NAME}_downloads:/downloads
      - ${GAMES_PATH}/${MC_FOLDER_NAME}_config:/config:ro
    configs:
      - source: bluemap_core
        target: /data/config/bluemap/core.conf
        uid: "1000"
        gid: "1000"
        mode: 0644
    networks:
      - shared_prominence_2_net
    deploy:
      resources:
        limits:
          memory: ${MAX_MEMORY}

  backups:
    image: itzg/mc-backup:latest
    restart: unless-stopped
    env_file:
      - stack.env
    environment:
      RCON_PASSWORD: ${RCON_PASSWORD}
    volumes:
      - ${GAMES_PATH}/rclone:/config/rclone # Optional, only if using rclone
      - ${GAMES_PATH}/${MC_FOLDER_NAME}:/data:ro
      - ${GAMES_PATH}/${MC_FOLDER_NAME}-backups:/backups
    networks:
      - shared_prominence_2_net

networks:
  shared_prominence_2_net:
    external: true

configs:
  # BlueMap only downloads the Minecraft client assets after the EULA is accepted here.
  bluemap_core:
    content: |
      accept-download: true
