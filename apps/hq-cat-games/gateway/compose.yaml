services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: always
    networks:
      - cloudflare_net
      - shared_cte2_net
      - shared_all_the_mons_net
    extra_hosts:
      - host.docker.internal:host-gateway
    env_file:
      - stack.env
    command: tunnel --no-autoupdate --protocol auto run --token ${HQCAT_GAMES_CFD_TOKEN}

  easytier:
    image: easytier/easytier:latest
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    env_file:
      - stack.env
    environment:
      ET_NETWORK_SECRET: ${ET_NETWORK_SECRET}
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ${GAMES_PATH}/easytier:/root

  playit:
    image: ghcr.io/playit-cloud/playit-agent:latest
    network_mode: host
    restart: unless-stopped
    environment:
      SECRET_KEY: ${PLAYIT_TOKEN}

networks:
  cloudflare_net:
    enable_ipv6: true
  shared_cte2_net:
    external: true
  shared_all_the_mons_net:
    external: true
