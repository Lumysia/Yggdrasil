services:
  all-the-mons:
    image: itzg/minecraft-server:${MC_JAVA_VERSION}
    restart: unless-stopped
    tty: true
    stdin_open: true
    ports:
      - ${MC_PORT}:25565/tcp
    env_file:
      - stack.env
    environment:
      RCON_PASSWORD: ${RCON_PASSWORD}
    volumes:
      - ${GAMES_PATH}/${MC_FOLDER_NAME}:/data
      - ${GAMES_PATH}/${MC_FOLDER_NAME}_downloads:/downloads
      - ${GAMES_PATH}/${MC_FOLDER_NAME}_config:/config:ro
    configs:
      - source: bluemap_core
        target: /data/config/bluemap/core.conf
        uid: "1000"
        gid: "1000"
        mode: 0644
      - source: rctmod_patch
        target: /patches/rctmod-server.json
    networks:
      - shared_all_the_mons_net
    deploy:
      resources:
        limits:
          memory: ${MAX_MEMORY}

networks:
  shared_all_the_mons_net:
    external: true

configs:
  # BlueMap only downloads the Minecraft client assets after the EULA is accepted here.
  bluemap_core:
    content: |
      accept-download: true
  # Applied by the image (PATCH_DEFINITIONS) after config sync, before the server starts.
  # The keys sit under [Players]; the file is skipped until the mod has created it once.
  rctmod_patch:
    content: |
      {
        "file": "/data/config/rctmod-server.toml",
        "ops": [
          { "$$set": { "path": "$$.Players.initialLevelCap", "value": 100 } },
          { "$$set": { "path": "$$.Players.allowOverLeveling", "value": true } }
        ]
      }
