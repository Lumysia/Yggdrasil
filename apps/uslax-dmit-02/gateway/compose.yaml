services:
  caddy:
    image: essaypu/caddy:alpine-proxy-nightly
    command:
      - caddy
      - docker-proxy
    restart: unless-stopped
    ports:
      - 127.0.0.1:${GATEWAY_WEB_HTTP_PORT}:80
      - 127.0.0.1:${GATEWAY_WEB_HTTPS_PORT}:443
    networks:
      - shared_gateway_net
    volumes:
      - ${APPDATA_PATH}/gateway/caddy/data:/data/caddy
      - ${APPDATA_PATH}/gateway/caddy/config:/config/caddy
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      caddy_0.admin: "off"

  haproxy:
    image: haproxy:lts-alpine
    restart: unless-stopped
    network_mode: host
    user: root
    cap_add:
      - NET_BIND_SERVICE
    env_file:
      - stack.env
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        cat > /tmp/haproxy.cfg <<EOF
        global
          log stdout format raw local0

        defaults
          log global
          mode tcp
          option tcplog
          timeout connect 10s
          timeout client 6h
          timeout server 6h

        frontend gateway_http
          mode http
          bind [::]:${GATEWAY_HTTP_PORT} v4v6
          http-request return status 400 hdr Server AkamaiGHost hdr Mime-Version 1.0 content-type text/html string "<HTML><HEAD><TITLE>Invalid URL</TITLE></HEAD><BODY><H1>Invalid URL</H1>The requested URL is invalid.</BODY></HTML>"

        frontend gateway_tls
          bind [::]:${GATEWAY_HTTPS_PORT} v4v6
          tcp-request inspect-delay 5s
          tcp-request content accept if { req.ssl_hello_type 1 }
        EOF

        tls_routes="$${GATEWAY_TLS_ROUTES:-}"
        if [ -n "$${GATEWAY_EXTRA_TLS_ROUTES:-}" ]; then
          if [ -n "$$tls_routes" ]; then
            tls_routes="$${tls_routes},$${GATEWAY_EXTRA_TLS_ROUTES}"
          else
            tls_routes="$${GATEWAY_EXTRA_TLS_ROUTES}"
          fi
        fi

        idx=1
        old_ifs="$$IFS"
        IFS=','
        for route in $$tls_routes; do
          sni="$${route%%=*}"
          target="$${route#*=}"
          if [ -n "$$sni" ] && [ "$$target" != "$$route" ]; then
            cat >> /tmp/haproxy.cfg <<EOF
          acl gateway_tls_route_$${idx} req.ssl_sni -i $${sni}
          use_backend gateway_tls_route_$${idx} if gateway_tls_route_$${idx}
        EOF
          fi
          idx=$$((idx + 1))
        done
        IFS="$$old_ifs"

        cat >> /tmp/haproxy.cfg <<EOF
          default_backend gateway_tls_fallback

        backend gateway_web_http
          server web ${GATEWAY_WEB_HTTP_HOST}:${GATEWAY_WEB_HTTP_PORT}

        backend gateway_web_https
          server web ${GATEWAY_WEB_HTTPS_HOST}:${GATEWAY_WEB_HTTPS_PORT}

        backend gateway_tls_fallback
          server upstream ${GATEWAY_TLS_FALLBACK_TARGET}
        EOF

        idx=1
        old_ifs="$$IFS"
        IFS=','
        for route in $$tls_routes; do
          sni="$${route%%=*}"
          target="$${route#*=}"
          if [ -n "$$sni" ] && [ "$$target" != "$$route" ]; then
            cat >> /tmp/haproxy.cfg <<EOF

        backend gateway_tls_route_$${idx}
          server upstream $${target}
        EOF
          fi
          idx=$$((idx + 1))
        done
        IFS="$$old_ifs"

        idx=1
        old_ifs="$$IFS"
        IFS=','
        for route in $${GATEWAY_TCP_ROUTES:-}; do
          listen="$${route%%=*}"
          target="$${route#*=}"
          if [ -n "$$listen" ] && [ "$$target" != "$$route" ]; then
            cat >> /tmp/haproxy.cfg <<EOF

        frontend gateway_tcp_route_$${idx}
          bind [::]:$${listen} v4v6
          default_backend gateway_tcp_route_backend_$${idx}

        backend gateway_tcp_route_backend_$${idx}
          server upstream $${target}
        EOF
          fi
          idx=$$((idx + 1))
        done
        IFS="$$old_ifs"

        exec haproxy -f /tmp/haproxy.cfg

networks:
  shared_gateway_net:
    external: true
