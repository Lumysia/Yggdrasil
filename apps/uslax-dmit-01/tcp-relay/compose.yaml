services:
  haproxy:
    image: haproxy:lts-alpine
    restart: unless-stopped
    env_file:
      - stack.env
    ports:
      - ${TCP_RELAY_LISTEN_PORT}:${TCP_RELAY_LISTEN_PORT}/tcp
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        cat > /usr/local/etc/haproxy/haproxy.cfg <<EOF
        global
          log stdout format raw local0

        defaults
          log global
          mode tcp
          option tcplog
          timeout connect 10s
          timeout client 6h
          timeout server 6h

        frontend tcp_relay
          bind *:${TCP_RELAY_LISTEN_PORT}
          default_backend tcp_relay_backend

        backend tcp_relay_backend
          server upstream ${TCP_RELAY_BACKEND_ADDR}:${TCP_RELAY_BACKEND_PORT} check inter 10s
        EOF
        exec haproxy -f /usr/local/etc/haproxy/haproxy.cfg
