services:
  dsh:
    image: essaypu/dsh:web-nightly
    restart: unless-stopped
    env_file:
      - stack.env
    # Upstream runs the trycua desktop with --shm-size=512m; Chromium needs more
    # than Docker's 64 MB default.
    shm_size: 512m
    environment:
      DSH_PUBLIC_URL: https://dsh1.${COMMON_DOMAIN_A}/
      DSH_TRUSTED_HOSTS: dsh1.${COMMON_DOMAIN_A}
      # DSH's bash tool inherits PATH from the dsh process, and the profile can't
      # set it; supervisord passes the container env through to the program.
      PATH: /home/cua/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      # @lumysia/dsh-oidc reads its site config from here; these win over the
      # profile. Without them the plugin refuses to start and Caddy denies all.
      DSH_OIDC_ISSUER: https://${COMMON_DOMAIN_AUTH}
      # Public PKCE client: the id is not a secret (it shows in every login redirect).
      DSH_OIDC_CLIENT_ID: afc9056d-16dc-443e-b0dd-b0ca612b3313
      DSH_OIDC_PUBLIC_ORIGIN: https://dsh1.${COMMON_DOMAIN_A}/
      # Who may sign in is decided by the Pocket ID client's allowed groups.
      DSH_OIDC_ALLOW_ANY_USER: "true"
      # Caddy reaches DSH over shared_dsh1_net, which only Caddy and DSH join.
      DSH_OIDC_TRUSTED_PROXIES: '["172.24.0.0/16"]'
      DSH_OIDC_DIRECT_LOGIN: "true"
    volumes:
      - ${APPDATA_PATH}/dsh/home:/home/cua
      # Livia's vault, shared with hermes1 (one copy, owned by hermes uid 10000).
      # Both users get access through POSIX ACLs; vault-acl keeps them working.
      - ${APPDATA_PATH}/hermes/home/Documents/Obsidian Vault/lia-notebook:/home/cua/Documents/lia-notebook
    # dsh-oidc: its login endpoints go straight to DSH; everything else, including
    # the sidebar's /_dsh-oidc/session, needs a valid session from /auth/check.
    # Caddy keeps Host by default. Upgrade headers are dropped only on the check
    # subrequest so WebSockets still pass.
    labels:
      caddy: dsh1.${COMMON_DOMAIN_A}
      caddy.import: common_tls
      caddy.@oidc: path /auth/login /auth/callback /auth/check /auth/signin /auth/logout
      caddy.0_handle: "@oidc"
      caddy.0_handle.reverse_proxy: "{{upstreams 3080}}"
      caddy.0_handle.reverse_proxy.header_up: X-Dsh-Oidc-Client-Ip {client_ip}
      caddy.1_handle.forward_auth: "{{upstreams 3080}}"
      caddy.1_handle.forward_auth.uri: /auth/check
      caddy.1_handle.forward_auth.0_header_up: -Connection
      caddy.1_handle.forward_auth.1_header_up: -Upgrade
      caddy.1_handle.reverse_proxy: "{{upstreams 3080}}"
    networks:
      - shared_dsh1_net

  # DSH (uid 1000) writes new files 0600 and Hermes (uid 10000) 0644, which
  # shrinks the ACL mask and locks the other agent out of a new note. This grants
  # both users once at start, then every 30 s on files changed since the last pass.
  vault-acl:
    image: alpine:3
    restart: unless-stopped
    command: ["sh", "/vault-acl.sh"]
    configs:
      - source: vault_acl_sh
        target: /vault-acl.sh
    volumes:
      - ${APPDATA_PATH}/hermes/home/Documents/Obsidian Vault/lia-notebook:/vault

configs:
  vault_acl_sh:
    content: |
      #!/bin/sh
      set -eu
      apk add --no-cache -q acl >/dev/null
      find /vault -exec setfacl -m u:1000:rwX,u:10000:rwX,m::rwX {} +
      find /vault -type d -exec setfacl -m d:u:1000:rwX,d:u:10000:rwX,d:m::rwX {} +
      touch /tmp/stamp
      while sleep 30; do
        touch /tmp/next
        find /vault -newer /tmp/stamp -exec setfacl -m u:1000:rwX,u:10000:rwX,m::rwX {} +
        find /vault -type d -newer /tmp/stamp -exec setfacl -m d:u:1000:rwX,d:u:10000:rwX,d:m::rwX {} +
        mv /tmp/next /tmp/stamp
      done

networks:
  shared_dsh1_net:
    external: true
