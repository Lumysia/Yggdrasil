services:
  dsh:
    image: essaypu/dsh:web-nightly
    restart: unless-stopped
    env_file:
      - stack.env
    # Upstream runs the trycua desktop with --shm-size=512m; Chromium needs more
    # than Docker's 64 MB default.
    shm_size: 512m
    environment:
      # The image sets TZ=Etc/UTC; local-time tools (date, cron's host zone,
      # Python/Node local time) follow this zone instead.
      TZ: America/Toronto
      DSH_PUBLIC_URL: https://dsh.${COMMON_DOMAIN_A}/
      DSH_TRUSTED_HOSTS: dsh.${COMMON_DOMAIN_A}
      # DSH itself listens on loopback only; dsh-oidc's gateway (below) is the one
      # listener Caddy reaches, and it refuses to start if DSH isn't on loopback.
      DSH_LISTEN_HOST: 127.0.0.1
      DSH_PORT: "3081"
      # DSH's bash tool inherits PATH from the dsh process, and the profile can't
      # set it; supervisord passes the container env through to the program.
      PATH: /home/cua/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      # @soffits/dsh-oidc reads its site config from here; these win over the
      # profile. Without them the plugin refuses to start, nothing answers on 3080
      # and Caddy returns 502.
      DSH_OIDC_ISSUER: https://${COMMON_DOMAIN_AUTH}
      # Public PKCE client: the id is not a secret (it shows in every login redirect).
      DSH_OIDC_CLIENT_ID: afc9056d-16dc-443e-b0dd-b0ca612b3313
      DSH_OIDC_PUBLIC_ORIGIN: https://dsh.${COMMON_DOMAIN_A}/
      # Who may sign in is decided by the Pocket ID client's allowed groups.
      DSH_OIDC_ALLOW_ANY_USER: "true"
      # Caddy reaches DSH over shared_dsh_net, which only Caddy and DSH join. Its
      # subnet is fixed where the gateway creates it (hq-cat-sandbox.toml).
      DSH_OIDC_TRUSTED_PROXIES: '["172.25.0.0/16"]'
      DSH_OIDC_DIRECT_LOGIN: "true"
      # Gateway mode: every request and WebSocket needs a dsh-oidc session, and the
      # plugin keeps DSH's own cookie to itself, so signing out or revoking a
      # session cuts it off completely. 0.0.0.0 inside the container reaches only
      # loopback and shared_dsh_net.
      DSH_OIDC_MODE: gateway
      DSH_OIDC_GATEWAY_LISTEN: 0.0.0.0:3080
    volumes:
      - ${APPDATA_PATH}/dsh/home:/home/cua
    # Caddy only terminates TLS: the dsh-oidc gateway on 3080 decides every
    # request itself. Caddy keeps Host; the client address header feeds the
    # login rate limit and the sessions list.
    labels:
      caddy: dsh.${COMMON_DOMAIN_A}
      caddy.import: common_tls
      caddy.reverse_proxy: "{{upstreams 3080}}"
      caddy.reverse_proxy.header_up: X-Dsh-Oidc-Client-Ip {client_ip}
    networks:
      - shared_dsh_net

networks:
  shared_dsh_net:
    external: true
