services:
  dsh:
    image: essaypu/dsh:web-nightly
    restart: unless-stopped
    env_file:
      - stack.env
    # Upstream runs the trycua desktop with --shm-size=512m; Chromium needs more
    # than Docker's 64 MB default.
    shm_size: 512m
    environment:
      DSH_PUBLIC_URL: https://dsh1.${COMMON_DOMAIN_A}/
      DSH_TRUSTED_HOSTS: dsh1.${COMMON_DOMAIN_A}
      # Read by the dsh-oidc profile patch (installed at runtime, see the PR).
      DSH_OIDC_ISSUER: https://${COMMON_DOMAIN_AUTH}
      DSH_OIDC_CLIENT_ID: ${DSH_OIDC_CLIENT_ID:?set HQCAT_SANDBOX_DSH_OIDC_CLIENT_ID in Komodo}
      DSH_OIDC_PUBLIC_ORIGIN: https://dsh1.${COMMON_DOMAIN_A}
      DSH_OIDC_ALLOWED_SUBJECTS: '[{"issuer":"https://${COMMON_DOMAIN_AUTH}","subject":"${DSH_OIDC_SUBJECT:?set HQCAT_SANDBOX_DSH_OIDC_SUBJECT in Komodo}"}]'
    volumes:
      - ${APPDATA_PATH}/dsh/home:/home/cua
    # dsh-oidc: its login endpoints go straight to DSH; everything else needs a
    # valid session from /auth/check. Caddy keeps Host by default. Upgrade headers
    # are dropped only on the check subrequest so WebSockets still pass.
    labels:
      caddy: dsh1.${COMMON_DOMAIN_A}
      caddy.import: common_tls
      caddy.@oidc: path /auth/login /auth/callback /auth/check /auth/signin /auth/logout
      caddy.0_handle: "@oidc"
      caddy.0_handle.reverse_proxy: "{{upstreams 3080}}"
      caddy.0_handle.reverse_proxy.header_up: X-Dsh-Oidc-Client-Ip {client_ip}
      caddy.1_handle.forward_auth: "{{upstreams 3080}}"
      caddy.1_handle.forward_auth.uri: /auth/check
      caddy.1_handle.forward_auth.0_header_up: -Connection
      caddy.1_handle.forward_auth.1_header_up: -Upgrade
      caddy.1_handle.reverse_proxy: "{{upstreams 3080}}"
    networks:
      - shared_dsh1_net

networks:
  shared_dsh1_net:
    external: true
