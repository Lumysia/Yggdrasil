x-hermes: &hermes
  image: nousresearch/hermes-agent:latest-desktop
  restart: unless-stopped
  command: ["gateway", "run"]
  env_file:
    - stack.env
  shm_size: 1g
  environment: &hermes-env
    HERMES_DASHBOARD: "1"
    HERMES_DASHBOARD_OIDC_ISSUER: https://${COMMON_DOMAIN_AUTH}

# Caddy routes; each instance adds its own host label.
x-hermes-routes: &hermes-routes
  caddy.import: common_tls
  caddy.@webhook.method: POST
  caddy.@webhook.path: /webhooks/*
  caddy.0_handle_path: /agent/*
  caddy.0_handle_path.reverse_proxy: "{{upstreams 8642}}"
  caddy.1_handle: "@webhook"
  caddy.1_handle.reverse_proxy: "{{upstreams 8644}}"
  caddy.2_handle.reverse_proxy: "{{upstreams 9119}}"

services:
  hermes1:
    <<: *hermes
    environment:
      <<: *hermes-env
      API_SERVER_KEY: ${HERMES1_API_SERVER_KEY:?set HQCAT_SANDBOX_HERMES1_API_SERVER_KEY in Komodo}
      HERMES_DASHBOARD_PUBLIC_URL: https://hms1.${COMMON_DOMAIN_A}
      HERMES_DASHBOARD_OIDC_CLIENT_ID: 04c146bb-d0b3-4d48-90de-f856259bc9ff
    volumes:
      - ${APPDATA_PATH}/hermes:/opt/data
    labels:
      <<: *hermes-routes
      caddy: hms1.${COMMON_DOMAIN_A}
    networks:
      - shared_hermes1_net

  hermes2:
    <<: *hermes
    environment:
      <<: *hermes-env
      API_SERVER_KEY: ${HERMES2_API_SERVER_KEY:?set HQCAT_SANDBOX_HERMES2_API_SERVER_KEY in Komodo}
      HERMES_DASHBOARD_PUBLIC_URL: https://hms2.${COMMON_DOMAIN_A}
      HERMES_DASHBOARD_OIDC_CLIENT_ID: eceabdea-96f6-4972-a284-d53c98f6ee0a
      AGENT_BROWSER_HEADED: "1"
    volumes:
      - ${APPDATA_PATH}/hermes2:/opt/data
    labels:
      <<: *hermes-routes
      caddy: hms2.${COMMON_DOMAIN_A}
    networks:
      - shared_hermes2_net

networks:
  shared_hermes1_net:
    external: true
  shared_hermes2_net:
    external: true
