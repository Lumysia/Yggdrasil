# Shared by every service that joins the media network and reads stack.env.
x-media-app: &media-app
  restart: unless-stopped
  networks:
    - shared_media_net
  env_file:
    - stack.env

services:
  plex:
    image: lscr.io/linuxserver/plex:latest
    <<: *media-app
    labels:
      caddy: media.${COMMON_DOMAIN_A}
      caddy.import_0: common_tls
      caddy.@bazarr.path: /bazarr /bazarr/*
      caddy.@prowlarr.path: /prowlarr /prowlarr/*
      caddy.@pulsarr.path: /pulsarr /pulsarr/*
      caddy.@radarr.path: /radarr /radarr/*
      caddy.@sonarr.path: /sonarr /sonarr/*
      caddy.@hometube.path: /hometube /hometube/*
      caddy.0_handle: /oauth2/*
      caddy.0_handle.reverse_proxy: oauth2-proxy:4180
      caddy.1_redir: /qbt /qbt/ 308
      caddy.2_handle_path: /qbt/*
      caddy.2_handle_path.0_import: protected_forward_auth
      caddy.2_handle_path.1_reverse_proxy: gluetun:8080
      caddy.2_handle_path.1_reverse_proxy.0_header_up: -Referer
      caddy.2_handle_path.1_reverse_proxy.1_header_up: -Origin
      caddy.3_redir: /pbh /pbh/ 308
      caddy.4_handle_path: /pbh/*
      caddy.4_handle_path.0_import: protected_forward_auth
      caddy.4_handle_path.1_reverse_proxy: peerbanhelper:9898
      caddy.5_redir: /bazarr /bazarr/ 308
      caddy.6_handle: "@bazarr"
      caddy.6_handle.0_import: protected_forward_auth
      caddy.6_handle.1_reverse_proxy: bazarr:6767
      caddy.7_redir: /prowlarr /prowlarr/ 308
      caddy.8_handle: "@prowlarr"
      caddy.8_handle.0_import: protected_forward_auth
      caddy.8_handle.1_reverse_proxy: prowlarr:9696
      caddy.9_redir: /pulsarr /pulsarr/ 308
      caddy.10_handle: "@pulsarr"
      caddy.10_handle.0_import: protected_forward_auth
      caddy.10_handle.1_reverse_proxy: pulsarr:3003
      caddy.11_redir: /radarr /radarr/ 308
      caddy.12_handle: "@radarr"
      caddy.12_handle.0_import: protected_forward_auth
      caddy.12_handle.1_reverse_proxy: radarr:7878
      caddy.13_redir: /sonarr /sonarr/ 308
      caddy.14_handle: "@sonarr"
      caddy.14_handle.0_import: protected_forward_auth
      caddy.14_handle.1_reverse_proxy: sonarr:8989
      caddy.15_redir: /hometube /hometube/ 308
      caddy.16_handle: "@hometube"
      caddy.16_handle.0_import: protected_forward_auth
      caddy.16_handle.1_reverse_proxy: hometube:8501
      caddy.17_handle: /*
      caddy.17_handle.reverse_proxy: "{{upstreams 32400}}"
    volumes:
      - ${APPDATA_PATH}/plex:/config
      - ${MEDIA_PATH}:/data
    tmpfs:
      - /transcode
    environment:
      VERSION: docker

  hometube:
    image: ghcr.io/egalitarianmonkey/hometube:latest
    <<: *media-app
    volumes:
      - ${MEDIA_PATH}/youtube:/data/videos
    environment:
      STREAMLIT_SERVER_BASE_URL_PATH: hometube
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/hometube/_stcore/health', timeout=5).read()"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  gluetun:
    image: qmcgaw/gluetun:latest
    <<: *media-app
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ${APPDATA_PATH}/gluetun:/gluetun
      - /tmp/gluetun:/tmp/gluetun
    # Image default allows ~25s; a failed first OpenVPN handshake retries after ~35s,
    # which marked gluetun unhealthy and blocked qbittorrent's depends_on.
    healthcheck:
      test: ["CMD-SHELL", "/gluetun-entrypoint healthcheck"]
      interval: 5s
      timeout: 5s
      start_period: 2m
      retries: 3
    environment:
      VPN_SERVICE_PROVIDER: private internet access
      OPENVPN_USER: ${OPENVPN_USER}
      OPENVPN_PASSWORD: ${OPENVPN_PASSWORD}
      VPN_PORT_FORWARDING: true
      VPN_PORT_FORWARDING_STATUS_FILE: /tmp/gluetun/forwarded_port

  qbit-gluetun-sync:
    image: ghcr.io/hononeko/qbit-gluetun-sync:latest
    restart: unless-stopped
    networks:
      - shared_media_net
    volumes:
      - /tmp/gluetun:/tmp/gluetun:ro
    depends_on:
      gluetun:
        condition: service_healthy
      qbittorrent:
        condition: service_started
    environment:
      QBIT_ADDR: http://gluetun:8080
      PORT_FILE: /tmp/gluetun/forwarded_port
      LISTEN_PORT: 9090

  qbittorrent:
    image: linuxserver/qbittorrent:latest
    restart: unless-stopped
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    volumes:
      - ${APPDATA_PATH}/qbittorrent:/config
      - ${MEDIA_PATH}:/data
    env_file:
      - stack.env
    configs:
      - source: qbittorrent_conf
        target: /defaults-gitops/qBittorrent.conf
      - source: qbittorrent_init
        target: /custom-cont-init.d/10-gitops-config
        mode: 0755

  peerbanhelper:
    image: ghostchu/peerbanhelper:latest
    <<: *media-app
    volumes:
      - ${APPDATA_PATH}/peerbanhelper:/app/data
      - /tmp/peerbanhelper:/tmp
    environment:
      # oauth2-proxy already guards /pbh, so skip PBH's own token prompt.
      PBH_WEB_REQUIRELOGIN: "false"

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    <<: *media-app
    volumes:
      - ${APPDATA_PATH}/bazarr:/config
      - ${MEDIA_PATH}:/data
    environment:
      DYNACONF_GENERAL__BASE_URL: /bazarr
      DYNACONF_AUTH__TYPE: "@none"

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    <<: *media-app
    volumes:
      - ${APPDATA_PATH}/prowlarr:/config
    environment:
      PROWLARR__SERVER__URLBASE: /prowlarr
      PROWLARR__AUTH__METHOD: External

  pulsarr:
    image: lakker/pulsarr:latest
    <<: *media-app
    volumes:
      - ${APPDATA_PATH}/pulsarr:/app/data
    environment:
      basePath: /pulsarr
      cookieSecured: true
      authenticationMethod: disabled

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    <<: *media-app
    volumes:
      - ${APPDATA_PATH}/radarr:/config
      - ${MEDIA_PATH}:/data
    environment:
      RADARR__SERVER__URLBASE: /radarr
      RADARR__AUTH__METHOD: External

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    <<: *media-app
    volumes:
      - ${APPDATA_PATH}/sonarr:/config
      - ${MEDIA_PATH}:/data
    environment:
      SONARR__SERVER__URLBASE: /sonarr
      SONARR__AUTH__METHOD: External

  flaresolverr:
    image: flaresolverr/flaresolverr:latest
    <<: *media-app
    volumes:
      - ${APPDATA_PATH}/flaresolverr:/config

networks:
  shared_media_net:
    external: true

configs:
  # Settings live here instead of a Komodo pre_deploy step. "$$" is a literal "$" for compose.
  qbittorrent_conf:
    content: |
      [Application]
      FileLogger\Age=1
      FileLogger\AgeType=1
      FileLogger\Backup=true
      FileLogger\DeleteOld=true
      FileLogger\Enabled=true
      FileLogger\MaxSizeBytes=66560
      FileLogger\Path=/config/qBittorrent/logs

      [AutoRun]
      enabled=false
      program=

      [BitTorrent]
      MergeTrackersEnabled=true
      Session\AddExtensionToIncompleteFiles=true
      Session\AdditionalTrackersURL=https://raw.githubusercontent.com/ngosang/trackerslist/master/trackers_best.txt
      Session\AddTorrentStopped=false
      Session\DefaultSavePath=/data/downloads/qbittorrent/
      Session\ExcludedFileNames=
      Session\GlobalMaxInactiveSeedingMinutes=360
      Session\GlobalMaxRatio=2
      Session\GlobalMaxSeedingMinutes=720
      Session\GlobalUPSpeedLimit=20480
      Session\MaxActiveDownloads=5
      Session\MaxActiveTorrents=10
      Session\MaxActiveUploads=5
      Session\Port=6881
      Session\QueueingSystemEnabled=true
      Session\SSL\Port=37619
      Session\ShareLimitAction=Stop
      Session\TempPath=/data/downloads/qbittorrent/incomplete/

      [Core]
      AutoDeleteAddedTorrentFile=IfAdded

      [LegalNotice]
      Accepted=true

      [Meta]
      MigrationVersion=8

      [Network]
      Cookies=@Invalid()
      PortForwardingEnabled=false
      Proxy\HostnameLookupEnabled=false
      Proxy\Profiles\BitTorrent=true
      Proxy\Profiles\Misc=true
      Proxy\Profiles\RSS=true

      [Preferences]
      Connection\PortRangeMin=6881
      Connection\UPnP=false
      Downloads\SavePath=/data/downloads/qbittorrent/
      Downloads\TempPath=/data/downloads/qbittorrent/incomplete/
      General\Locale=en
      General\StatusbarExternalIPDisplayed=true
      MailNotification\req_auth=true
      WebUI\Address=*
      WebUI\AuthSubnetWhitelist=172.16.0.0/12, 100.64.0.0/10
      WebUI\AuthSubnetWhitelistEnabled=true
      WebUI\LocalHostAuth=false
      WebUI\ServerDomains=*

      [RSS]
      AutoDownloader\DownloadRepacks=true
      AutoDownloader\SmartEpisodeFilter=s(\\d+)e(\\d+), (\\d+)x(\\d+), "(\\d{4}[.\\-]\\d{1,2}[.\\-]\\d{1,2})", "(\\d{1,2}[.\\-]\\d{1,2}[.\\-]\\d{4})"
  qbittorrent_init:
    content: |
      #!/bin/bash
      # Applies the repo's qBittorrent settings on every start, keeping the listen
      # port that qbit-gluetun-sync sets from the VPN's forwarded port.
      conf=/config/qBittorrent/qBittorrent.conf
      port=$$(sed -n 's/^Session\\Port=//p' "$$conf" 2>/dev/null | head -n 1)
      mkdir -p /config/qBittorrent
      cp /defaults-gitops/qBittorrent.conf "$$conf"
      if [ -n "$$port" ]; then
        sed -i "s|^Session\\\\Port=.*|Session\\\\Port=$$port|" "$$conf"
      fi
      lsiown abc:abc "$$conf"
