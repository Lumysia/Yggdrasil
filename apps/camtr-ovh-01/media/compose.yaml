  plex:
    image: lscr.io/linuxserver/plex:latest
    restart: unless-stopped
    networks:
      - shared_media_net
    labels:
      caddy: media.${COMMON_DOMAIN_A}
      caddy.import_0: common_tls
      caddy.@bazarr.path: /bazarr /bazarr/*
      caddy.@lingarr_assets.path: /assets/* /favicon.ico /index-*.css /index-*.js /services-*.js /speculationrules.json
      caddy.@prowlarr.path: /prowlarr /prowlarr/*
      caddy.@pulsarr.path: /pulsarr /pulsarr/*
      caddy.@radarr.path: /radarr /radarr/*
      caddy.@sonarr.path: /sonarr /sonarr/*
      caddy.0_handle: /oauth2/*
      caddy.0_handle.reverse_proxy: oauth2-proxy:4180
      caddy.1_redir: /qbt /qbt/ 308
      caddy.2_handle_path: /qbt/*
      caddy.2_handle_path.0_import: protected_forward_auth
      caddy.2_handle_path.1_reverse_proxy: gluetun:8080
      caddy.2_handle_path.1_reverse_proxy.0_header_up: -Referer
      caddy.2_handle_path.1_reverse_proxy.1_header_up: -Origin
      caddy.3_redir: /pbh /pbh/ 308
      caddy.4_handle_path: /pbh/*
      caddy.4_handle_path.0_import: protected_forward_auth
      caddy.4_handle_path.1_reverse_proxy: peerbanhelper:9898
      caddy.5_redir: /bazarr /bazarr/ 308
      caddy.6_handle: "@bazarr"
      caddy.6_handle.0_import: protected_forward_auth
      caddy.6_handle.1_reverse_proxy: bazarr:6767
      caddy.7_redir: /lingarr /lingarr/ 308
      caddy.8_handle_path: /lingarr/*
      caddy.8_handle_path.0_import: protected_forward_auth
      caddy.8_handle_path.1_reverse_proxy: lingarr:9876
      caddy.9_handle: "@lingarr_assets"
      caddy.9_handle.0_import: protected_forward_auth
      caddy.9_handle.1_reverse_proxy: lingarr:9876
      caddy.10_redir: /prowlarr /prowlarr/ 308
      caddy.11_handle: "@prowlarr"
      caddy.11_handle.0_import: protected_forward_auth
      caddy.11_handle.1_reverse_proxy: prowlarr:9696
      caddy.12_redir: /pulsarr /pulsarr/ 308
      caddy.13_handle: "@pulsarr"
      caddy.13_handle.0_import: protected_forward_auth
      caddy.13_handle.1_reverse_proxy: pulsarr:3003
      caddy.14_redir: /radarr /radarr/ 308
      caddy.15_handle: "@radarr"
      caddy.15_handle.0_import: protected_forward_auth
      caddy.15_handle.1_reverse_proxy: radarr:7878
      caddy.16_redir: /sonarr /sonarr/ 308
      caddy.17_handle: "@sonarr"
      caddy.17_handle.0_import: protected_forward_auth
      caddy.17_handle.1_reverse_proxy: sonarr:8989
      caddy.18_handle: /*
      caddy.18_handle.reverse_proxy: "{{upstreams 32400}}"
    volumes:
      - ${APPDATA_PATH}/plex:/config
      - ${MEDIA_PATH}:/data
      - /tmp/plex-transcode:/transcode
    env_file:
      - stack.env
    environment:
      VERSION: docker
      PLEX_CLAIM: ${PLEX_CLAIM}

  # jellyfin:
  #   image: lscr.io/linuxserver/jellyfin:latest
  #   networks:
  #     - shared_media_net
  #   labels:
  #     caddy: jellyfin.${COMMON_DOMAIN_A}
  #     caddy.import_0: common_tls
  #     caddy.reverse_proxy: "{{upstreams 8096}}"
  #   # ports:
  #   #   - 127.0.0.1:8096:8096
  #   volumes:
  #     - ${APPDATA_PATH}/jellyfin:/config
  #     - ${MEDIA_PATH}:/data
  #   tmpfs:
  #     - /cache
  #   restart: unless-stopped
  #   env_file:
  #     - stack.env

  gluetun:
    image: qmcgaw/gluetun:latest
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    networks:
      - shared_media_net
    #ports:
    #  - 8080:8080
    volumes:
      - ${APPDATA_PATH}/gluetun:/gluetun
      - /tmp-gluetun:/tmp/gluetun
    env_file:
      - stack.env
    environment:
      VPN_SERVICE_PROVIDER: private internet access
      OPENVPN_USER: ${OPENVPN_USER}
      OPENVPN_PASSWORD: ${OPENVPN_PASSWORD}
      VPN_PORT_FORWARDING: true
      VPN_PORT_FORWARDING_STATUS_FILE: /tmp/gluetun/forwarded_port

  qbit-gluetun-sync:
    image: ghcr.io/hononeko/qbit-gluetun-sync:latest
    restart: unless-stopped
    networks:
      - shared_media_net
    volumes:
      - /tmp-gluetun:/tmp/gluetun:ro
    depends_on:
      - gluetun
      - qbittorrent
    environment:
      QBIT_ADDR: http://gluetun:8080
      PORT_FILE: /tmp/gluetun/forwarded_port
      LISTEN_PORT: 9090
  
  qbittorrent:
    image: linuxserver/qbittorrent:latest
    restart: unless-stopped
    network_mode: service:gluetun
    depends_on:
      - gluetun
    # ports:
    #   - 127.0.0.1:8080:8080
    volumes:
      - ${APPDATA_PATH}/qbittorrent:/config
      - ${MEDIA_PATH}:/data
    env_file:
      - stack.env

  peerbanhelper:
    image: ghostchu/peerbanhelper:latest
    restart: unless-stopped
    networks:
      - shared_media_net
    volumes:
      - ${APPDATA_PATH}/peerbanhelper:/app/data
      - /tmp/peerbanhelper:/tmp
    # ports:
    #   - 9898:9898
    env_file:
      - stack.env

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    restart: unless-stopped
    networks:
      - shared_media_net
    volumes:
      - ${APPDATA_PATH}/bazarr:/config
      - ${MEDIA_PATH}:/data
    env_file:
      - stack.env

  lingarr:
    image: ghcr.io/lingarr-translate/lingarr:latest
    restart: unless-stopped
    networks:
      - shared_media_net
    volumes:
      - ${APPDATA_PATH}/lingarr:/app/config
      - ${MEDIA_PATH}:/data
    env_file:
      - stack.env
    environment:
      ASPNETCORE_URLS: http://+:9876
      AUTH_ENABLED: "false"
      DB_CONNECTION: sqlite
      SQLITE_DB_PATH: Lingarr.db
      DB_HANGFIRE_SQLITE_PATH: /app/config/Hangfire.db
      RADARR_URL: http://radarr:7878/radarr
      SONARR_URL: http://sonarr:8989/sonarr

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    restart: unless-stopped
    networks:
      - shared_media_net
    # ports:
    #   - 9696:9696
    volumes:
      - ${APPDATA_PATH}/prowlarr:/config
    env_file:
      - stack.env
    environment:
      PROWLARR__SERVER__URLBASE: /prowlarr

  pulsarr:
    image: lakker/pulsarr:latest
    restart: unless-stopped
    networks:
      - shared_media_net
    volumes:
      - ${APPDATA_PATH}/pulsarr:/app/data
    env_file:
      - stack.env
    environment:
      basePath: /pulsarr
      cookieSecured: true
      authenticationMethod: disabled

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    restart: unless-stopped
    networks:
      - shared_media_net
    # ports:
    #   - 7878:7878
    volumes:
      - ${APPDATA_PATH}/radarr:/config
      - ${MEDIA_PATH}:/data
    env_file:
      - stack.env
    environment:
      RADARR__SERVER__URLBASE: /radarr

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    restart: unless-stopped
    networks:
      - shared_media_net
    # ports:
    #   - 8989:8989
    volumes:
      - ${APPDATA_PATH}/sonarr:/config
      - ${MEDIA_PATH}:/data
    env_file:
      - stack.env
    environment:
      SONARR__SERVER__URLBASE: /sonarr

  flaresolverr:
    image: flaresolverr/flaresolverr:latest
    restart: unless-stopped
    networks:
      shared_media_net:
    # ports:
    #   - 8191:8191
    volumes:
      - ${APPDATA_PATH}/flaresolverr:/config
    env_file:
      - stack.env

networks:
  shared_media_net:
    external: true
