services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    networks:
      - shared_media_net
    labels:
      caddy: media.${COMMON_DOMAIN_A}
      caddy.import_0: common_tls
      caddy.@prowlarr.path: /prowlarr /prowlarr/*
      caddy.@radarr.path: /radarr /radarr/*
      caddy.@sonarr.path: /sonarr /sonarr/*
      caddy.0_handle: /oauth2/*
      caddy.0_handle.reverse_proxy: oauth2-proxy:4180
      caddy.1_redir: /qbt /qbt/ 308
      caddy.2_handle_path: /qbt/*
      caddy.2_handle_path.0_import: protected_forward_auth
      caddy.2_handle_path.1_reverse_proxy: gluetun:8080
      caddy.2_handle_path.1_reverse_proxy.0_header_up: -Referer
      caddy.2_handle_path.1_reverse_proxy.1_header_up: -Origin
      caddy.3_redir: /pbh /pbh/ 308
      caddy.4_handle_path: /pbh/*
      caddy.4_handle_path.0_import: protected_forward_auth
      caddy.4_handle_path.1_reverse_proxy: peerbanhelper:9898
      caddy.5_redir: /prowlarr /prowlarr/ 308
      caddy.6_handle: "@prowlarr"
      caddy.6_handle.0_import: protected_forward_auth
      caddy.6_handle.1_reverse_proxy: prowlarr:9696
      caddy.7_redir: /radarr /radarr/ 308
      caddy.8_handle: "@radarr"
      caddy.8_handle.0_import: protected_forward_auth
      caddy.8_handle.1_reverse_proxy: radarr:7878
      caddy.9_redir: /sonarr /sonarr/ 308
      caddy.10_handle: "@sonarr"
      caddy.10_handle.0_import: protected_forward_auth
      caddy.10_handle.1_reverse_proxy: sonarr:8989
      caddy.11_handle: /*
      caddy.11_handle.reverse_proxy: jellyfin:8096
    # ports:
    #   - 127.0.0.1:8096:8096
    volumes:
      - ${APPDATA_PATH}/jellyfin:/config
      - ${MEDIA_PATH}:/data
    tmpfs:
      - /cache
    restart: unless-stopped
    env_file:
      - stack.env

  gluetun:
    image: qmcgaw/gluetun:latest
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    networks:
      - shared_media_net
    #ports:
    #  - 8080:8080
    volumes:
      - ${APPDATA_PATH}/gluetun:/gluetun
      - /tmp-gluetun:/tmp/gluetun
    env_file:
      - stack.env
    environment:
      VPN_SERVICE_PROVIDER: private internet access
      OPENVPN_USER: ${OPENVPN_USER}
      OPENVPN_PASSWORD: ${OPENVPN_PASSWORD}
      SERVER_REGIONS: CA Montreal
      VPN_PORT_FORWARDING: true
      VPN_PORT_FORWARDING_STATUS_FILE: /tmp/gluetun/forwarded_port

  qbit-gluetun-sync:
    image: ghcr.io/hononeko/qbit-gluetun-sync:latest
    restart: unless-stopped
    networks:
      - shared_media_net
    volumes:
      - /tmp-gluetun:/tmp/gluetun:ro
    depends_on:
      - gluetun
      - qbittorrent
    environment:
      QBIT_ADDR: http://gluetun:8080
      PORT_FILE: /tmp/gluetun/forwarded_port
      LISTEN_PORT: 9090
  
  qbittorrent:
    image: linuxserver/qbittorrent:latest
    restart: unless-stopped
    network_mode: service:gluetun
    depends_on:
      - gluetun
    # ports:
    #   - 127.0.0.1:8080:8080
    volumes:
      - ${APPDATA_PATH}/qbittorrent:/config
      - ${MEDIA_PATH}:/data
    env_file:
      - stack.env

  peerbanhelper:
    image: ghostchu/peerbanhelper:latest
    restart: unless-stopped
    networks:
      - shared_media_net
    volumes:
      - ${APPDATA_PATH}/peerbanhelper:/app/data
      - /tmp/peerbanhelper:/tmp
    # ports:
    #   - 9898:9898
    env_file:
      - stack.env

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    restart: unless-stopped
    networks:
      - shared_media_net
    # ports:
    #   - 9696:9696
    volumes:
      - ${APPDATA_PATH}/prowlarr:/config
    env_file:
      - stack.env
    environment:
      PROWLARR__SERVER__URLBASE: /prowlarr

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    restart: unless-stopped
    networks:
      - shared_media_net
    # ports:
    #   - 7878:7878
    volumes:
      - ${APPDATA_PATH}/radarr:/config
      - ${MEDIA_PATH}:/data
    env_file:
      - stack.env
    environment:
      RADARR__SERVER__URLBASE: /radarr

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    restart: unless-stopped
    networks:
      - shared_media_net
    # ports:
    #   - 8989:8989
    volumes:
      - ${APPDATA_PATH}/sonarr:/config
      - ${MEDIA_PATH}:/data
    env_file:
      - stack.env
    environment:
      SONARR__SERVER__URLBASE: /sonarr

  flaresolverr:
    image: flaresolverr/flaresolverr:latest
    restart: unless-stopped
    networks:
      shared_media_net:
    # ports:
    #   - 8191:8191
    volumes:
      - ${APPDATA_PATH}/flaresolverr:/config
    env_file:
      - stack.env

networks:
  shared_media_net:
    external: true
