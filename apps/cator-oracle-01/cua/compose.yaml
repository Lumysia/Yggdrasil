services:
  cua:
    image: trycua/cua-xfce:latest
    restart: unless-stopped
    shm_size: 512m
    env_file:
      - stack.env
    labels:
      caddy: cua.${COMMON_DOMAIN_A}
      caddy.import_0: common_tls
      caddy.import_1: protected_reverse_proxy "{{upstreams 6901}}"
    volumes:
      - ${APPDATA_PATH}/cua/storage:/home/cua/storage
      - ${APPDATA_PATH}/cua/shared:/home/cua/shared
    networks:
      - shared_cua_net

networks:
  shared_cua_net:
    external: true
