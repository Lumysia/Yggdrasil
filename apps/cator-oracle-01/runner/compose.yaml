x-runner: &runner
  image: code.forgejo.org/forgejo/runner:12
  restart: unless-stopped
  user: root
  command: ["sh", "/start.sh"]
  env_file:
    - stack.env

services:
  forgejo-runner-1:
    <<: *runner
    environment:
      FORGEJO_DOMAIN: ${FORGEJO_DOMAIN}
      FORGEJO_RUNNER_REGISTRATION_TOKEN: ${FORGEJO_RUNNER_REGISTRATION_TOKEN}
      FORGEJO_RUNNER_NAME: ${FORGEJO_RUNNER_NAME}-1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./start.sh:/start.sh:ro
      - ${APPDATA_PATH}/forgejo-runner-1:/data

  forgejo-runner-2:
    <<: *runner
    environment:
      FORGEJO_DOMAIN: ${FORGEJO_DOMAIN}
      FORGEJO_RUNNER_REGISTRATION_TOKEN: ${FORGEJO_RUNNER_REGISTRATION_TOKEN}
      FORGEJO_RUNNER_NAME: ${FORGEJO_RUNNER_NAME}-2
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./start.sh:/start.sh:ro
      - ${APPDATA_PATH}/forgejo-runner-2:/data

  forgejo-runner-3:
    <<: *runner
    environment:
      FORGEJO_DOMAIN: ${FORGEJO_DOMAIN}
      FORGEJO_RUNNER_REGISTRATION_TOKEN: ${FORGEJO_RUNNER_REGISTRATION_TOKEN}
      FORGEJO_RUNNER_NAME: ${FORGEJO_RUNNER_NAME}-3
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./start.sh:/start.sh:ro
      - ${APPDATA_PATH}/forgejo-runner-3:/data

  forgejo-runner-4:
    <<: *runner
    environment:
      FORGEJO_DOMAIN: ${FORGEJO_DOMAIN}
      FORGEJO_RUNNER_REGISTRATION_TOKEN: ${FORGEJO_RUNNER_REGISTRATION_TOKEN}
      FORGEJO_RUNNER_NAME: ${FORGEJO_RUNNER_NAME}-4
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./start.sh:/start.sh:ro
      - ${APPDATA_PATH}/forgejo-runner-4:/data
