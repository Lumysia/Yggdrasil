[[stack]]
name = "uslax-dmit-01-gateway"
tags = ["auto-deploy"]
[stack.config]
server = "uslax-dmit-01"
poll_for_updates = true
auto_update = true
linked_repo = "GitHub-Yggdrasil"
run_directory = "apps/uslax-dmit-01/gateway"
additional_env_files = [
  { path = "stack.env", track = true }
]
pre_deploy.command = """
docker network create shared_gateway_net || true
"""
extra_args = ["--remove-orphans"]
environment = """
GATEWAY_TLS_ROUTES=[[COMMON_ENTRY_GATEWAY_TLS_ROUTES]],file.[[COMMON_DOMAIN_B]]=100.126.143.61:443
GATEWAY_TCP_ROUTES=[[USLAX_DMIT_01_GATEWAY_TCP_ROUTES]]
"""

