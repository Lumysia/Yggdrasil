[[stack]]
name = "hq-cat-games-mc-craft-to-exile-2"
tags = ["origin", "service"]
[stack.config]
server = "hq-cat-games"
poll_for_updates = true
auto_update = true
linked_repo = "GitHub-Yggdrasil"
run_directory = "apps/hq-cat-games/mc-craft-to-exile-2"
additional_env_files = [
  { path = "stack.env", track = true }
]
pre_deploy.command = """
docker network create shared_cte2_net || true
mkdir -p /data/games/mc-craft-to-exile-2_config/bluemap
touch /data/games/mc-craft-to-exile-2_config/bluemap/core.conf
if grep -q '^accept-download:' /data/games/mc-craft-to-exile-2_config/bluemap/core.conf; then
  sed -i 's/^accept-download:.*/accept-download: true/' /data/games/mc-craft-to-exile-2_config/bluemap/core.conf
else
  printf '\naccept-download: true\n' >> /data/games/mc-craft-to-exile-2_config/bluemap/core.conf
fi
"""
pre_deploy.shell_mode = true
extra_args = ["--remove-orphans"]
environment = """
RCON_PASSWORD=[[HQCAT_GAMES_CTE2_RCONPWD]]
"""

##

