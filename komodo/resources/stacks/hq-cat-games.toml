# No stack on this host is tagged deploy: game servers are started and stopped by hand,
# and repo changes here are deployed by hand too.
[[stack]]
name = "hq-cat-games-gateway"
tags = ["origin", "ingress"]
[stack.config]
server = "hq-cat-games"
auto_update = true
linked_repo = "GitHub-Yggdrasil"
run_directory = "apps/hq-cat-games/gateway"
additional_env_files = ["stack.env"]
pre_deploy.command = """
for net in shared_cte2_net shared_all_the_mons_net shared_prominence_2_net; do
  docker network inspect "$net" >/dev/null 2>&1 || docker network create "$net"
done
"""
pre_deploy.shell_mode = true
extra_args = ["--remove-orphans"]
environment = """
ET_NETWORK_SECRET=[[HQCAT_GAMES_ET_NETWORK_SECRET]]
HQCAT_GAMES_CFD_TOKEN=[[HQCAT_GAMES_CFD_TOKEN]]
PLAYIT_TOKEN=[[HQCAT_GAMES_PLAYIT_TOKEN]]
"""

