[[stack]]
name = "jptyo-greencloud-02-gateway"
tags = ["edge", "ingress", "deploy"]
[stack.config]
server = "jptyo-greencloud-02"
auto_update = true
linked_repo = "GitHub-Yggdrasil"
run_directory = "apps/jptyo-greencloud-02/gateway"
additional_env_files = ["stack.env"]
pre_deploy.command = """
for net in shared_gateway_net; do
  docker network inspect "$net" >/dev/null 2>&1 || docker network create "$net"
done
"""
pre_deploy.shell_mode = true
extra_args = ["--remove-orphans"]
environment = """
COMMON_ENTRY_GATEWAY_TLS_ROUTES=[[COMMON_ENTRY_GATEWAY_TLS_ROUTES]]
"""

