[[stack]]
name = "hq-cat-services-seafile"
tags = ["origin", "service", "deploy"]
[stack.config]
server = "hq-cat-services"
auto_update = true
# The sdoc, notification, metadata, search and AI images track the Seafile server release;
# update them together.
auto_update_all_services = true
linked_repo = "GitHub-Yggdrasil"
run_directory = "apps/hq-cat-services/seafile"
additional_env_files = ["stack.env"]
extra_args = ["--remove-orphans"]
environment = """
COMMON_DOMAIN_A=[[COMMON_DOMAIN_A]]
INIT_SS_ADMIN_USER=j6lk5
INIT_SS_ADMIN_PASSWORD=[[HQCAT_SERVICES_SFSS_ADMIN_PASSWORD]]
SEASEARCH_TOKEN=[[HQCAT_SERVICES_SFSS_TOKEN]]
INIT_SEAFILE_MYSQL_ROOT_PASSWORD=[[HQCAT_SERVICES_SFDB_ROOT_PASSWORD]]
JWT_PRIVATE_KEY=[[HQCAT_SERVICES_SF_JWT_PRIVATE_KEY]]
REDIS_PASSWORD=[[HQCAT_SERVICES_SFREDIS_PASSWORD]]
SEAFILE_MYSQL_DB_PASSWORD=[[HQCAT_SERVICES_SFDB_PASSWORD]]
ONLYOFFICE_JWT_SECRET=[[HQCAT_SERVICES_SFOFFICE_JWT_SECRET]]
"""

