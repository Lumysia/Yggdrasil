[[stack]]
name = "camtr-ovh-01-gateway"
tags = ["origin", "ingress", "deploy"]
[stack.config]
server = "camtr-ovh-01"
auto_update = true
linked_repo = "GitHub-Yggdrasil"
run_directory = "apps/camtr-ovh-01/gateway"
additional_env_files = ["stack.env"]
pre_deploy.command = """
for net in shared_media_net; do
  docker network inspect "$net" >/dev/null 2>&1 || docker network create "$net"
done
"""
pre_deploy.shell_mode = true
extra_args = ["--remove-orphans"]
environment = """
CLOUDFLARE_API_TOKEN=[[COMMON_CF_API_TOKEN]]
COMMON_CADDY_ADMIN_EMAIL=[[COMMON_CADDY_ADMIN_EMAIL]]
COMMON_DOMAIN_A=[[COMMON_DOMAIN_A]]
COMMON_DOMAIN_AUTH=[[COMMON_DOMAIN_AUTH]]
CAMTROVH01_CFD_TOKEN=[[CAMTROVH01_CFD_TOKEN]]
OAUTH2_PROXY_CLIENT_SECRET=[[COMMON_OAUTH2_CLIENT_SECRET]]
OAUTH2_PROXY_COOKIE_SECRET=[[COMMON_OAUTH2_COOKIE_SECRET]]
"""

##

[[stack]]
name = "camtr-ovh-01-media"
# Not tagged deploy: repo changes to this stack are deployed by hand.
tags = ["origin", "service"]
[stack.config]
server = "camtr-ovh-01"
auto_update = true
# qbittorrent shares gluetun's network namespace (network_mode: service:gluetun),
# so it has to be recreated whenever gluetun is: update and redeploy the stack as a whole.
auto_update_all_services = true
destroy_before_deploy = true
linked_repo = "GitHub-Yggdrasil"
run_directory = "apps/camtr-ovh-01/media"
additional_env_files = ["stack.env"]
pre_deploy.command = '''
appdata_path=/data/appdata
media_path=/data/media

# Create and own only the directories this stack needs, not their contents:
# the containers run as 1000:1000 and keep their own files owned that way.
media_dirs="$media_path $media_path/downloads $media_path/downloads/qbittorrent
  $media_path/downloads/qbittorrent/incomplete $media_path/movies
  $media_path/tvshows $media_path/youtube"
app_dirs="$appdata_path/bazarr $appdata_path/plex $appdata_path/pulsarr
  $appdata_path/qbittorrent"

mkdir -p $media_dirs $app_dirs
chown 1000:1000 $media_dirs $app_dirs
chmod u+rwx,g+rwx $media_dirs
'''
pre_deploy.shell_mode = true
extra_args = ["--remove-orphans"]
environment = """
COMMON_DOMAIN_A=[[COMMON_DOMAIN_A]]
OPENVPN_USER=[[CAMTROVH01_PIA_USERNAME]]
OPENVPN_PASSWORD=[[CAMTROVH01_PIA_PASSWORD]]
# PLEX_CLAIM is only needed for first-time Plex server claim.
"""

##

[[stack]]
name = "camtr-ovh-01-alacarte"
# Not tagged deploy: repo changes to this stack are deployed by hand.
tags = ["origin", "service"]
[stack.config]
server = "camtr-ovh-01"
auto_update = true
# alacarte-web depends on alacarte-wrapper; update and redeploy both together.
auto_update_all_services = true
linked_repo = "GitHub-Yggdrasil"
run_directory = "apps/camtr-ovh-01/alacarte"
additional_env_files = ["stack.env"]
pre_deploy.command = '''
appdata_path=/data/appdata
media_path=/data/media

mkdir -p \
  "$appdata_path/alacarte/web" \
  "$appdata_path/alacarte/wrapper" \
  "$appdata_path/alacarte/supervisor" \
  "$media_path/music"
'''
pre_deploy.shell_mode = true
environment = """
COMMON_DOMAIN_A=[[COMMON_DOMAIN_A]]
"""

##
