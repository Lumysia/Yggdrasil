[[stack]]
name = "camtr-ovh-01-gateway"
tags = ["origin", "ingress", "deploy"]
[stack.config]
server = "camtr-ovh-01"
poll_for_updates = true
auto_update = true
linked_repo = "GitHub-Yggdrasil"
run_directory = "apps/camtr-ovh-01/gateway"
additional_env_files = [
  { path = "stack.env", track = true }
]
pre_deploy.command = """
if ! docker network inspect shared_media_net >/dev/null 2>&1; then
  docker network create shared_media_net
fi
"""
pre_deploy.shell_mode = true
extra_args = ["--remove-orphans"]
environment = """
CLOUDFLARE_API_TOKEN=[[COMMON_CF_API_TOKEN]]
COMMON_CADDY_ADMIN_EMAIL=[[COMMON_CADDY_ADMIN_EMAIL]]
COMMON_DOMAIN_A=[[COMMON_DOMAIN_A]]
COMMON_DOMAIN_AUTH=[[COMMON_DOMAIN_AUTH]]
CAMTROVH01_CFD_TOKEN=[[CAMTROVH01_CFD_TOKEN]]
OAUTH2_PROXY_CLIENT_SECRET=[[COMMON_OAUTH2_CLIENT_SECRET]]
OAUTH2_PROXY_COOKIE_SECRET=[[COMMON_OAUTH2_COOKIE_SECRET]]
"""

##

[[stack]]
name = "camtr-ovh-01-media"
tags = ["origin", "service"]
[stack.config]
server = "camtr-ovh-01"
poll_for_updates = true
auto_update = true
auto_update_all_services = true
destroy_before_deploy = true
linked_repo = "GitHub-Yggdrasil"
run_directory = "apps/camtr-ovh-01/media"
additional_env_files = [
  { path = "stack.env", track = true }
]
pre_deploy.command = '''
mkdir -p /data/media/downloads/qbittorrent/incomplete /data/media/movies /data/media/tvshows
mkdir -p /data/appdata/bazarr/config /data/appdata/lingarr /data/appdata/plex /data/appdata/pulsarr /data/appdata/qbittorrent/qBittorrent /tmp/plex-transcode
qbt_conf=/data/appdata/qbittorrent/qBittorrent/qBittorrent.conf
current_port=
if [ -f "$qbt_conf" ]; then
  current_port=$(sed -n 's/^Session\\Port=//p' "$qbt_conf" | head -n 1)
fi
cp qBittorrent.conf "$qbt_conf"
if [ -n "$current_port" ]; then
  sed -i "s|^Session\\\\Port=.*|Session\\\\Port=$current_port|" "$qbt_conf"
fi
for arr in prowlarr radarr sonarr; do
  arr_conf="/data/appdata/$arr/config.xml"
  if [ -f "$arr_conf" ]; then
    sed -i 's|<AuthenticationMethod>None</AuthenticationMethod>|<AuthenticationMethod>External</AuthenticationMethod>|' "$arr_conf"
  fi
done
bazarr_conf=/data/appdata/bazarr/config/config.yaml
if [ ! -f "$bazarr_conf" ]; then
  cat > "$bazarr_conf" <<'EOF'
general:
  base_url: /bazarr
auth:
  type: null
EOF
else
  sed -i \
    -e '/^general:/,/^[^[:space:]#][^:]*:/ s|^\([[:space:]]*base_url:\).*|\1 /bazarr|' \
    -e '/^auth:/,/^[^[:space:]#][^:]*:/ s|^\([[:space:]]*type:\).*|\1 null|' \
    "$bazarr_conf"
fi
chown -R 1000:1000 /data/media
chown -R 1000:1000 /data/appdata/bazarr /data/appdata/lingarr /data/appdata/plex /data/appdata/pulsarr /tmp/plex-transcode
chown -R 1000:1000 /data/appdata/qbittorrent
chmod -R u+rwX,g+rwX /data/media
'''
pre_deploy.shell_mode = true
extra_args = ["--remove-orphans"]
environment = """
COMMON_DOMAIN_A=[[COMMON_DOMAIN_A]]
OPENVPN_USER=[[CAMTROVH01_PIA_USERNAME]]
OPENVPN_PASSWORD=[[CAMTROVH01_PIA_PASSWORD]]
PLEX_CLAIM=[[CAMTROVH01_PLEX_CLAIM]]
"""

