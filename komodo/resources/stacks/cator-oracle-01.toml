##

[[stack]]
name = "cator-oracle-01-lunatv"
tags = ["origin", "service", "deploy"]
[stack.config]
server = "cator-oracle-01"
poll_for_updates = true
auto_update = true
linked_repo = "GitHub-Yggdrasil"
run_directory = "apps/cator-oracle-01/lunatv"
additional_env_files = [
  { path = "stack.env", track = true }
]
pre_deploy.command = """
mkdir -p /data/db/lunatv-kvrocks
chown -R 999:999 /data/db/lunatv-kvrocks
"""
pre_deploy.shell_mode = true
extra_args = ["--remove-orphans"]
environment = """
COMMON_DOMAIN_B=[[COMMON_DOMAIN_B]]
LUNATV_PASSWORD=[[CATOR_ORACLE_01_LUNATV_PASSWORD]]
"""

##
