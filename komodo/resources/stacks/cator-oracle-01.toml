[[stack]]
name = "cator-oracle-01-gateway"
tags = ["origin", "ingress", "deploy"]
[stack.config]
server = "cator-oracle-01"
poll_for_updates = true
auto_update = true
linked_repo = "GitHub-Yggdrasil"
run_directory = "apps/cator-oracle-01/gateway"
additional_env_files = [
  { path = "stack.env", track = true }
]
extra_args = ["--remove-orphans"]
environment = """
CLOUDFLARE_API_TOKEN=[[COMMON_CF_API_TOKEN]]
COMMON_CADDY_ADMIN_EMAIL=[[COMMON_CADDY_ADMIN_EMAIL]]
COMMON_DOMAIN_A=[[COMMON_DOMAIN_A]]
COMMON_DOMAIN_AUTH=[[COMMON_DOMAIN_AUTH]]
CATOR_ORACLE_01_CFD_TOKEN=[[CATOR_ORACLE_01_CFD_TOKEN]]
OAUTH2_PROXY_CLIENT_SECRET=[[COMMON_OAUTH2_CLIENT_SECRET]]
OAUTH2_PROXY_COOKIE_SECRET=[[COMMON_OAUTH2_COOKIE_SECRET]]
"""

##

[[stack]]
name = "cator-oracle-01-runner"
tags = ["origin", "service", "deploy"]
[stack.config]
