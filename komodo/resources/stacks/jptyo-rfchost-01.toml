[[stack]]
name = "jptyo-rfchost-01-gateway"
tags = ["edge", "ingress", "deploy"]
[stack.config]
server = "jptyo-rfchost-01"
poll_for_updates = true
auto_update = true
linked_repo = "GitHub-Yggdrasil"
run_directory = "apps/jptyo-rfchost-01/gateway"
additional_env_files = [
  { path = "stack.env", track = true }
]
pre_deploy.command = """
docker network create shared_gateway_net || true
"""
extra_args = ["--remove-orphans"]

