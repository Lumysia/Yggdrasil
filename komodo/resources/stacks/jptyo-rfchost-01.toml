[[stack]]
name = "jptyo-rfchost-01-remnawave-node"
tags = ["edge", "service", "deploy"]
[stack.config]
server = "jptyo-rfchost-01"
poll_for_updates = true
auto_update = true
linked_repo = "GitHub-Yggdrasil"
run_directory = "apps/jptyo-rfchost-01/remnawave-node"
additional_env_files = [
  { path = "stack.env", track = true }
]
extra_args = ["--remove-orphans"]
environment = """
REMNANODE_SECRET_KEY=[[JPTYO_RFCHOST_01_REMNANODE_SECRET_KEY]]
"""
