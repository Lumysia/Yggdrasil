[[alerter]]
name = "Komodo Ntfy"
[alerter.config]
enabled = true
endpoint.type = "Ntfy"
# Full topic URL, kept in a secret Komodo variable because this repo is public.
endpoint.params.url = "[[COMMON_KOMODO_NTFY_URL]]"
alert_types = [
  "ServerUnreachable",
  "ServerDisk",
  "ServerVersionMismatch",
  "StackStateChange",
  "ResourceSyncPendingUpdates",
  "ProcedureFailed",
  "ActionFailed"
]

##
