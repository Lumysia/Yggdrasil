# Started by hand with ./komodo-infra-mgnt.sh on each host; Komodo does not deploy this.
# Same Periphery as periphery-only, plus a Tailscale node for hosts without one.
services:
  periphery:
    extends:
      file: ../periphery-only/docker-compose.yml
      service: periphery
    volumes:
      # Host root's home, e.g. its docker CLI config, for Periphery (HOME=/root).
      - /root:/root

  tailscale:
    image: ${KOMODO_INFRA_DOCKER_IMAGE_PREFIX:-}tailscale/tailscale:latest
    restart: always
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    cap_add:
      - net_admin
      - sys_module
    devices:
      - /dev/net/tun:/dev/net/tun
    network_mode: host
    volumes:
      - /etc/resolv.conf:/etc/resolv.conf
      - ${KOMODO_INFRA_DATA_DIR}/tailscale:/var/lib/tailscale
    environment:
      TS_ACCEPT_DNS: false
      TS_USERSPACE: false
      TS_AUTHKEY: ${TAILSCALE_AUTH_KEY:-}
      # containerboot re-applies TS_HOSTNAME and TS_ACCEPT_DNS on every start.
      TS_HOSTNAME: ${TAILSCALE_HOSTNAME}
      # Used only by the first `tailscale up`. Later starts keep the node's existing tags,
      # so a TAILSCALE_TAGS change on an existing node has to be made in the admin console.
      TS_EXTRA_ARGS: --snat-subnet-routes=false --advertise-tags=${TAILSCALE_TAGS} --advertise-exit-node=false
      TS_AUTH_ONCE: true
      TS_STATE_DIR: /var/lib/tailscale/state
    post_start:
      # Settings containerboot doesn't re-apply. An empty TS_RELAY_SERVER_PORT turns the relay off.
      - command: sh -c 'until tailscale status >/dev/null 2>&1; do sleep 1; done; tailscale set --advertise-exit-node=false --advertise-routes= --snat-subnet-routes=false --relay-server-port="${TS_RELAY_SERVER_PORT:-}"'

  watchtower:
    extends:
      file: ../periphery-only/docker-compose.yml
      service: watchtower
