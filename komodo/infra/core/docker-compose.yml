# Started by hand with ./komodo-infra-mgnt.sh on the Core host; Komodo does not deploy this.
services:
  mongo:
    # Pinned to the major.minor running now. Watchtower still pulls 9.0.x patches;
    # moving to a new release is a manual change here.
    image: ${KOMODO_INFRA_DOCKER_IMAGE_PREFIX:-}mongo:9.0
    labels:
      komodo.skip:
      com.centurylinklabs.watchtower.enable: "true"
    command: --quiet --wiredTigerCacheSizeGB 0.25
    restart: unless-stopped
    # Only the root login. These apply on first init of an empty data dir.
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${KOMODO_DATABASE_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${KOMODO_DATABASE_PASSWORD}
    volumes:
      - ${KOMODO_INFRA_DATA_DIR}/mongo-data:/data/db
      - ${KOMODO_INFRA_DATA_DIR}/mongo-config:/data/configdb

  core:
    image: ghcr.io/moghtech/komodo-core:${COMPOSE_KOMODO_IMAGE_TAG:-2}
    init: true
    labels:
      komodo.skip:
      com.centurylinklabs.watchtower.enable: "true"
    restart: unless-stopped
    depends_on:
      - mongo
    env_file:
      - .env
    ports:
      - 9120:9120
    volumes:
      - ${KOMODO_INFRA_DATA_DIR}/keys:/config/keys
      - ${KOMODO_INFRA_DATA_DIR}/repo-cache:/repo-cache
      - ${KOMODO_INFRA_DATA_DIR}/syncs:/syncs
      - ${KOMODO_INFRA_DATA_DIR}/backups:/backups

  periphery:
    image: ghcr.io/moghtech/komodo-periphery:${COMPOSE_KOMODO_IMAGE_TAG:-2}
    init: true
    labels:
      komodo.skip:
      com.centurylinklabs.watchtower.enable: "true"
    restart: unless-stopped
    depends_on:
      - core
    env_file:
      - .env
    volumes:
      - ${KOMODO_INFRA_DATA_DIR}/keys:/config/keys
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/proc
      - /sys:/sys:ro
      - ${KOMODO_INFRA_DATA_DIR}/periphery:/etc/komodo
      - /data:/data

  watchtower:
    image: ${KOMODO_INFRA_DOCKER_IMAGE_PREFIX:-}nickfedor/watchtower:latest
    labels:
      komodo.skip:
      com.centurylinklabs.watchtower.enable: "true"
    restart: unless-stopped
    command:
      - --label-enable
      - --cleanup
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
