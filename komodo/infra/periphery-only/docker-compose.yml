# Started by hand with ./komodo-infra-mgnt.sh on each host; Komodo does not deploy this.
# periphery-tailscale/docker-compose.yml extends both services below.
services:
  periphery:
    image: ghcr.io/moghtech/komodo-periphery:${COMPOSE_KOMODO_IMAGE_TAG:-2}
    init: true
    restart: always
    ports:
      - 8120:8120
    volumes:
      - ${KOMODO_INFRA_DATA_DIR}/komodo-keys:/config/keys
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/proc
      - /sys:/sys:ro
      - ${KOMODO_INFRA_DATA_DIR}/komodo-periphery:/etc/komodo
      - /data:/data
    environment:
      PERIPHERY_CORE_PUBLIC_KEYS: MCowBQYDK2VuAyEAMnQVnJN2WVoWyyWbaA8R8wzvon/XJ2cYQzvpb7S14TU=
      PERIPHERY_SSL_ENABLED: true
      PERIPHERY_DISABLE_TERMINALS: false
      # komodo-infra-mgnt.sh adds /data when it is its own filesystem.
      PERIPHERY_INCLUDE_DISK_MOUNTS: ${PERIPHERY_INCLUDE_DISK_MOUNTS:-/etc/hostname}
      PERIPHERY_LOGGING_PRETTY: false
      PERIPHERY_PRETTY_STARTUP_CONFIG: false
    labels:
      komodo.skip:
      com.centurylinklabs.watchtower.enable: "true"

  watchtower:
    image: ${KOMODO_INFRA_DOCKER_IMAGE_PREFIX:-}nickfedor/watchtower:latest
    labels:
      komodo.skip:
      com.centurylinklabs.watchtower.enable: "true"
    restart: unless-stopped
    command:
      - --label-enable
      - --cleanup
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
