name: sakina-access

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/sakina-access/**'
      - '.github/workflows/sakina-access.yaml'
  pull_request:
    paths:
      - 'scripts/sakina-access/**'
      - '.github/workflows/sakina-access.yaml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SSHD: /usr/sbin/sshd
    steps:
      - uses: actions/checkout@v7
        with:
          # The tests update installs of older versions, which they take from the history.
          fetch-depth: 0
      - name: Install sshd and busybox
        run: sudo apt-get update && sudo apt-get install -y openssh-server busybox
      - name: ShellCheck
        run: |
          cd scripts/sakina-access
          shellcheck -s sh sakina-access sakina-access-openwrt test.sh
          mkdir -p "$RUNNER_TEMP/openwrt/etc" && touch "$RUNNER_TEMP/openwrt/etc/openwrt_release"
          for root in "$RUNNER_TEMP/linux" "$RUNNER_TEMP/openwrt"; do
            SAKINA_ACCESS_ROOT=$root sh sakina-access show | awk '/^===== / { n++; next } n == 1' > "$root.helper"
            shellcheck -s sh "$root.helper"
          done
      - name: Find the dropbear current OpenWrt stable ships
        run: |
          stable=$(curl -fsSL https://downloads.openwrt.org/.versions.json | jq -r .stable_version)
          makefile=$(curl -fsSL "https://raw.githubusercontent.com/openwrt/openwrt/openwrt-${stable%.*}/package/network/services/dropbear/Makefile")
          version=$(printf '%s\n' "$makefile" | sed -n 's/^PKG_VERSION:=//p')
          hash=$(printf '%s\n' "$makefile" | sed -n 's/^PKG_HASH:=//p')
          test -n "$version" && test -n "$hash"
          echo "OpenWrt $stable ships dropbear $version"
          { echo "DROPBEAR_VERSION=$version"; echo "DROPBEAR_SHA256=$hash"; } >> "$GITHUB_ENV"
      - name: Build dropbear
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://matt.ucc.asn.au/dropbear/releases/dropbear-$DROPBEAR_VERSION.tar.bz2"
          echo "$DROPBEAR_SHA256  dropbear-$DROPBEAR_VERSION.tar.bz2" | sha256sum -c -
          tar xjf "dropbear-$DROPBEAR_VERSION.tar.bz2"
          cd "dropbear-$DROPBEAR_VERSION"
          ./configure --disable-zlib --disable-lastlog --disable-utmp --disable-wtmp --disable-utmpx --disable-wtmpx > /dev/null
          make -j"$(nproc)" PROGRAMS="dropbear dropbearkey" > /dev/null
          echo "DROPBEAR=$PWD/dropbear" >> "$GITHUB_ENV"
      - name: Test with dash
        run: dash scripts/sakina-access/test.sh
      - name: Test with BusyBox
        run: busybox sh scripts/sakina-access/test.sh
      - name: Test with bash
        run: bash scripts/sakina-access/test.sh
