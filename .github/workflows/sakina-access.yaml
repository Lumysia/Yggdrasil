name: sakina-access

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/sakina-access/**'
      - '.github/workflows/sakina-access.yaml'
  pull_request:
    paths:
      - 'scripts/sakina-access/**'
      - '.github/workflows/sakina-access.yaml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: ShellCheck
        run: shellcheck scripts/sakina-access/sakina-access scripts/sakina-access/test.sh
      - name: Install sshd
        run: test -x /usr/sbin/sshd || { sudo apt-get update && sudo apt-get install -y openssh-server; }
      - name: Test
        run: scripts/sakina-access/test.sh
        env:
          SSHD: /usr/sbin/sshd

  test-openwrt:
    runs-on: ubuntu-latest
    env:
      # The dropbear release OpenWrt 25.12 ships; the hash is OpenWrt's PKG_HASH.
      DROPBEAR_VERSION: '2025.89'
      DROPBEAR_SHA256: 0d1f7ca711cfc336dc8a85e672cab9cfd8223a02fe2da0a4a7aeb58c9e113634
    steps:
      - uses: actions/checkout@v7
      - name: Install busybox
        run: sudo apt-get update && sudo apt-get install -y busybox
      - name: ShellCheck
        run: |
          shellcheck -s sh scripts/sakina-access/sakina-access-openwrt scripts/sakina-access/test-openwrt.sh
          busybox sh scripts/sakina-access/sakina-access-openwrt show |
            awk '/^===== \/usr\/sbin/ { f = 1; next } /^===== / { f = 0 } f' > "$RUNNER_TEMP/sakina-ssh"
          shellcheck -s sh "$RUNNER_TEMP/sakina-ssh"
      - name: Build dropbear
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://matt.ucc.asn.au/dropbear/releases/dropbear-$DROPBEAR_VERSION.tar.bz2"
          echo "$DROPBEAR_SHA256  dropbear-$DROPBEAR_VERSION.tar.bz2" | sha256sum -c -
          tar xjf "dropbear-$DROPBEAR_VERSION.tar.bz2"
          cd "dropbear-$DROPBEAR_VERSION"
          ./configure --disable-zlib --disable-lastlog --disable-utmp --disable-wtmp --disable-utmpx --disable-wtmpx > /dev/null
          make -j"$(nproc)" PROGRAMS="dropbear dropbearkey" > /dev/null
      - name: Test
        run: scripts/sakina-access/test-openwrt.sh
        env:
          BUSYBOX: /usr/bin/busybox
          DROPBEAR: ${{ runner.temp }}/dropbear-${{ env.DROPBEAR_VERSION }}/dropbear
