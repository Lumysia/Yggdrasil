version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "nix"
    directory: "/nixos"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker-compose"
    directories:
      - "/apps/*/*"
    schedule:
      interval: "weekly"
    ignore:
      # Dependabot can't get an anonymous token from code.forgejo.org, which fails the whole job.
      - dependency-name: "forgejo/runner"
      # Database major upgrades need a dump and restore; do them by hand.
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
      - dependency-name: "mariadb"
        update-types: ["version-update:semver-major"]
